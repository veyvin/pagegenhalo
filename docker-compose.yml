version: '3.8'

services:
  pagegen:
    build:
      context: .
      dockerfile: Dockerfile
    image: pagegen:go
    container_name: pagegen
    restart: unless-stopped
    ports:
      - "${PORT:-5555}:5555"
    env_file:
      - .env
    environment:
      - PORT=5555
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - pagegen-network

networks:
  pagegen-network:
    driver: bridge
