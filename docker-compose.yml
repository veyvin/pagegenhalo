services:
  pagegen:
    image: pagegenhalo
    container_name: pagegenhalo
    restart: unless-stopped
    ports:
      - "10001:5555"
    environment:
      - PORT=5555
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_API_URL=${DEEPSEEK_API_URL:-https://api.deepseek.com/chat/completions}
      - HALO_URL=${HALO_URL:-https://veyvin.com}
      - HALO_TOKEN=${HALO_TOKEN}
      - GOOGLE_AUTH_SECRET=${GOOGLE_AUTH_SECRET}
      - CONFIG_PREVIEW_PASSWORD=${CONFIG_PREVIEW_PASSWORD:-admin123}
      - COVER_IMAGE_BACKEND=${COVER_IMAGE_BACKEND:-ollama}
      - COVER_WEB_ENGINE=${COVER_WEB_ENGINE:-bing_cn}
      - OLLAMA_URL=${OLLAMA_URL:-http://localhost:11434}
      - OLLAMA_IMAGE_MODEL=${OLLAMA_IMAGE_MODEL:-x/z-image-turbo}
      - SD_WEBUI_URL=${SD_WEBUI_URL:-http://localhost:7860}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
