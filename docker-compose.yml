version: '3.8'

services:
  pagegen:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pagegen
    restart: unless-stopped
    ports:
      - "${PORT:-5555}:5555"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - FLASK_ENV=production
      - PORT=5555
      - OLLAMA_URL=http://ollama:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - pagegen-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - pagegen-network
    profiles:
      - cover

volumes:
  ollama-data:

networks:
  pagegen-network:
    driver: bridge
