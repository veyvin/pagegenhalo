<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halo 文章发布工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header p { opacity: 0.9; font-size: 1.1em; }
        .content { padding: 40px; }
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; font-size: 1.1em; }
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            resize: vertical;
            transition: border-color 0.3s;
        }
        textarea:focus { outline: none; border-color: #667eea; }
        .options { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 25px; }
        .option-group { flex: 1; min-width: 200px; }
        .option-group label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .option-group input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
        .tags-input {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            min-height: 50px;
        }
        .tag {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tag-remove { cursor: pointer; font-weight: bold; }
        .tag-input { border: none; outline: none; flex: 1; min-width: 100px; font-size: 14px; }
        .button-group { display: flex; gap: 15px; margin-top: 30px; }
        button {
            flex: 1;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4); }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover:not(:disabled) { background: #e0e0e0; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .result { margin-top: 30px; padding: 20px; border-radius: 8px; display: none; }
        .result.success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .result.error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .result.show { display: block; }
        .preview { margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 8px; border: 1px solid #e0e0e0; display: none; }
        .preview.show { display: block; }
        .preview h3 { margin-bottom: 15px; color: #333; }
        .preview-content { background: white; padding: 20px; border-radius: 8px; max-height: 500px; overflow-y: auto; }
        .preview-title { font-size: 1.5em; font-weight: bold; margin-bottom: 15px; color: #667eea; }
        .help-text { font-size: 0.9em; color: #666; margin-top: 5px; }
        .example-prompt { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 10px; border-left: 4px solid #667eea; }
        .example-prompt h4 { margin-bottom: 10px; color: #333; }
        .example-prompt code { background: #e9ecef; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
        .debug-log { margin-top: 30px; padding: 20px; background: #1e1e1e; color: #e0e0e0; border-radius: 8px; border: 1px solid #333; display: none; }
        .debug-log.show { display: block; }
        .debug-log h3 { margin-bottom: 10px; color: #fff; }
        .debug-log pre { max-height: 200px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; font-family: 'Fira Code', monospace; font-size: 13px; margin: 0; }
        .history-list { list-style: none; padding: 0; margin: 0; background: #f8f9fa; border-radius: 8px; border: 1px solid #e0e0e0; max-height: 280px; overflow-y: auto; }
        .history-list li { padding: 12px 16px; border-bottom: 1px solid #e9ecef; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
        .history-list li:last-child { border-bottom: none; }
        .history-list li:hover { background: #e9ecef; }
        .history-list .history-title { font-weight: 500; color: #333; }
        .history-list .history-meta { font-size: 12px; color: #666; }
        @media (max-width: 768px) {
            body { padding: 10px; }
            .header h1 { font-size: 1.6em; }
            .content { padding: 20px; }
            .option-group { min-width: 100%; }
            .button-group { flex-direction: column; }
            button { min-height: 48px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>🚀 Halo 文章发布工具</h1>
                    <p>使用 DeepSeek API 生成文章并发布到 Halo</p>
                </div>
                <a href="/logout" style="color: white; text-decoration: none; padding: 10px 20px; background: rgba(255, 255, 255, 0.2); border-radius: 8px;">登出</a>
            </div>
        </div>
        
        <div class="content">
            <form id="articleForm">
                <div class="form-group">
                    <label for="prompt">文章 Prompt</label>
                    <textarea id="prompt" name="prompt" placeholder="请输入你想要生成的文章的 prompt" required></textarea>
                    <div class="help-text">💡 提示：你可以描述文章的主题、内容要求、风格等。</div>
                </div>

                <div class="options">
                    <div class="option-group">
                        <label>
                            <input type="checkbox" id="use_template" checked>
                            <span>使用格式模板</span>
                        </label>
                    </div>
                    <div class="option-group">
                        <label for="template_id">写作风格</label>
                        <select id="template_id" style="padding: 8px 12px; border-radius: 6px; border: 2px solid #e0e0e0;">
                            {{range .template_options}}
                            <option value="{{.id}}">{{.label}}</option>
                            {{end}}
                        </select>
                    </div>
                    <div class="option-group">
                        <label for="language">输出语言</label>
                        <select id="language" style="padding: 8px 12px; border-radius: 6px; border: 2px solid #e0e0e0;">
                            <option value="zh">中文</option>
                            <option value="en">English</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label>
                            <input type="checkbox" id="auto_extract_tags">
                            <span>自动提取标签与分类</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>标签（可选）</label>
                    <div class="tags-input" id="tagsContainer">
                        <input type="text" class="tag-input" id="tagInput" placeholder="输入标签后按回车添加">
                    </div>
                </div>

                <div class="form-group">
                    <label>分类（可选）</label>
                    <div class="tags-input" id="categoriesContainer">
                        <input type="text" class="tag-input" id="categoryInput" placeholder="输入分类后按回车添加">
                    </div>
                </div>

                <div class="button-group">
                    <button type="button" class="btn-secondary" id="generateOnlyBtn">仅生成（预览）</button>
                    <button type="button" class="btn-secondary" id="generateBtn">生成并保存为草稿</button>
                    <button type="button" class="btn-primary" id="generateAndPublishBtn">生成并发布</button>
                </div>
            </form>

            <div id="result" class="result"></div>

            <div id="preview" class="preview">
                <h3>文章预览</h3>
                <div class="preview-actions" style="margin-bottom: 12px;">
                    <button type="button" class="btn-primary" id="publishPreviewBtn" disabled style="flex: none;">发布当前预览</button>
                </div>
                <div class="preview-content">
                    <div class="preview-title" id="previewTitle"></div>
                    <div id="previewContent"></div>
                </div>
            </div>

            <div class="form-group" style="margin-top: 30px;">
                <label>历史生成</label>
                <ul id="historyList" class="history-list"></ul>
            </div>
        </div>
    </div>

    <script>
        const tags = [];
        const categories = [];
        let currentPreview = { title: null, content: null };

        function getPayload() {
            return {
                prompt: document.getElementById('prompt').value.trim(),
                use_template: document.getElementById('use_template').checked,
                template_id: document.getElementById('template_id').value,
                language: document.getElementById('language').value,
                auto_extract_tags: document.getElementById('auto_extract_tags').checked,
                tags: tags,
                categories: categories
            };
        }

        function showResult(message, isSuccess = true) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result ' + (isSuccess ? 'success' : 'error') + ' show';
            resultDiv.textContent = message;
            if (isSuccess) setTimeout(() => resultDiv.classList.remove('show'), 3000);
        }

        function showPreview(title, content) {
            currentPreview = { title, content };
            document.getElementById('previewTitle').textContent = title;
            document.getElementById('previewContent').innerHTML = content;
            document.getElementById('preview').classList.add('show');
            document.getElementById('publishPreviewBtn').disabled = false;
        }

        function escapeHtml(s) {
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }

        async function loadHistory() {
            const listEl = document.getElementById('historyList');
            try {
                const res = await fetch('/api/history?limit=20');
                const data = await res.json();
                if (!data.success || !data.data) { listEl.innerHTML = '<li class="history-meta">暂无历史</li>'; return; }
                listEl.innerHTML = data.data.map(item => {
                    const time = item.created_at ? new Date(item.created_at).toLocaleString('zh-CN') : '';
                    return '<li data-id="' + item.id + '"><span class="history-title">' + escapeHtml(item.title || '无标题') + '</span><span class="history-meta">' + time + '</span></li>';
                }).join('');
            } catch (e) {
                listEl.innerHTML = '<li class="history-meta">加载失败</li>';
            }
        }

        document.getElementById('generateOnlyBtn').addEventListener('click', async () => {
            const payload = getPayload();
            if (!payload.prompt) { showResult('请输入 prompt', false); return; }
            const btn = document.getElementById('generateOnlyBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>生成中...';
            try {
                const res = await fetch('/api/generate-only', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                const data = await res.json();
                if (data.success && data.title && data.content) {
                    showResult(data.message || '已生成', true);
                    showPreview(data.title, data.content);
                    loadHistory();
                } else {
                    showResult(data.error || '生成失败', false);
                }
            } catch (e) { showResult('请求失败: ' + e.message, false); }
            finally { btn.disabled = false; btn.innerHTML = '仅生成（预览）'; }
        });

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const payload = getPayload();
            if (!payload.prompt) { showResult('请输入 prompt', false); return; }
            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>生成中...';
            try {
                const res = await fetch('/api/generate', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                const data = await res.json();
                if (data.success) {
                    showResult(data.message || '已保存为草稿', true);
                    if (data.title && data.content) showPreview(data.title, data.content);
                    loadHistory();
                } else { showResult(data.error || '生成失败', false); }
            } catch (e) { showResult('请求失败: ' + e.message, false); }
            finally { btn.disabled = false; btn.innerHTML = '生成并保存为草稿'; }
        });

        document.getElementById('generateAndPublishBtn').addEventListener('click', async () => {
            const payload = getPayload();
            if (!payload.prompt) { showResult('请输入 prompt', false); return; }
            const btn = document.getElementById('generateAndPublishBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>生成中...';
            try {
                const res = await fetch('/api/generate-and-publish', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                const data = await res.json();
                if (data.title && data.content) showPreview(data.title, data.content);
                if (data.success) { showResult('发布成功', true); loadHistory(); }
                else { showResult(data.error || '发布失败', false); }
            } catch (e) { showResult('请求失败: ' + e.message, false); }
            finally { btn.disabled = false; btn.innerHTML = '生成并发布'; }
        });

        document.getElementById('publishPreviewBtn').addEventListener('click', async () => {
            if (!currentPreview.title) { showResult('请先生成文章', false); return; }
            const btn = document.getElementById('publishPreviewBtn');
            btn.disabled = true;
            try {
                const res = await fetch('/api/publish', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ title: currentPreview.title, content: currentPreview.content, tags, categories }) });
                const data = await res.json();
                if (data.success) { showResult('发布成功', true); loadHistory(); }
                else { showResult('发布失败: ' + data.error, false); btn.disabled = false; }
            } catch (e) { showResult('请求失败', false); btn.disabled = false; }
        });

        document.getElementById('historyList').addEventListener('click', async (e) => {
            const li = e.target.closest('li[data-id]');
            if (!li) return;
            try {
                const res = await fetch('/api/history/' + li.dataset.id);
                const data = await res.json();
                if (data.success) { showPreview(data.title, data.content || ''); showResult('已加载到预览', true); }
            } catch (e) { showResult('加载失败', false); }
        });

        // Tag input
        document.getElementById('tagInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const tag = e.target.value.trim();
                if (tag && !tags.includes(tag)) { tags.push(tag); updateTagsDisplay(); e.target.value = ''; }
            }
        });
        document.getElementById('tagsContainer').addEventListener('click', (e) => {
            if (e.target.classList.contains('tag-remove')) {
                const idx = tags.indexOf(e.target.dataset.tag);
                if (idx > -1) { tags.splice(idx, 1); updateTagsDisplay(); }
            }
        });
        function updateTagsDisplay() {
            const container = document.getElementById('tagsContainer');
            container.querySelectorAll('.tag').forEach(t => t.remove());
            tags.forEach(tag => {
                const el = document.createElement('span');
                el.className = 'tag';
                el.innerHTML = tag + ' <span class="tag-remove" data-tag="' + tag + '">×</span>';
                container.insertBefore(el, document.getElementById('tagInput'));
            });
        }

        // Category input
        document.getElementById('categoryInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const cat = e.target.value.trim();
                if (cat && !categories.includes(cat)) { categories.push(cat); updateCategoriesDisplay(); e.target.value = ''; }
            }
        });
        document.getElementById('categoriesContainer').addEventListener('click', (e) => {
            if (e.target.classList.contains('tag-remove')) {
                const idx = categories.indexOf(e.target.dataset.cat);
                if (idx > -1) { categories.splice(idx, 1); updateCategoriesDisplay(); }
            }
        });
        function updateCategoriesDisplay() {
            const container = document.getElementById('categoriesContainer');
            container.querySelectorAll('.tag').forEach(t => t.remove());
            categories.forEach(cat => {
                const el = document.createElement('span');
                el.className = 'tag';
                el.innerHTML = cat + ' <span class="tag-remove" data-cat="' + cat + '">×</span>';
                container.insertBefore(el, document.getElementById('categoryInput'));
            });
        }

        loadHistory();
    </script>
</body>
</html>
