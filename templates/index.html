<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halo 文章发布工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #111;
            --border: #333;
            --text-primary: #fff;
            --text-secondary: #aaa;
            --text-muted: #666;
            --accent-blue: #00d4ff;
            --accent-purple: #7c3aed;
            --accent-pink: #f472b6;
        }
        body { background: var(--bg-primary); min-height: 100vh; font-family: 'Inter', -apple-system, sans-serif; }
        .card { background: var(--bg-secondary); border: 1px solid var(--border); }
        .btn-gradient { 
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
        }
        .btn-gradient:hover { opacity: 0.9; }
        .input-field { 
            background: var(--bg-tertiary); 
            border: 1px solid var(--border); 
            color: var(--text-primary);
        }
        .input-field:focus { border-color: var(--accent-blue); outline: none; }
        .input-field::placeholder { color: var(--text-muted); }
        .tag { background: var(--accent-purple); }
        .history-item { border-bottom: 1px solid var(--border); }
        .history-item:hover { background: var(--bg-tertiary); }
        .preview-content h2 { font-size: 1.5rem; font-weight: bold; margin: 1.5rem 0 1rem; color: var(--accent-pink); }
        .preview-content h3 { font-size: 1.25rem; font-weight: 600; margin: 1.25rem 0 0.75rem; color: var(--accent-blue); }
        .preview-content p { margin: 0.75rem 0; line-height: 1.75; color: var(--text-secondary); }
        .preview-content pre { background: #0a0a0a; color: #e0e0e0; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 1rem 0; border: 1px solid var(--border); }
        .preview-content code { background: #222; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.875rem; color: var(--accent-blue); font-family: 'JetBrains Mono', monospace; }
        .preview-content pre code { background: transparent; padding: 0; }
        .preview-content blockquote { border-left: 3px solid var(--accent-purple); padding-left: 1rem; margin: 1rem 0; color: var(--text-muted); }
        .preview-content ul, .preview-content ol { margin: 0.75rem 0; padding-left: 1.5rem; color: var(--text-secondary); }
        .preview-content li { margin: 0.375rem 0; }
        .loading { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .glow { box-shadow: 0 0 20px rgba(0, 212, 255, 0.2); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <div class="card rounded-xl overflow-hidden">
            <!-- Header -->
            <div class="bg-gradient-to-r from-cyan-500 via-purple-500 to-pink-500 p-6">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold text-white flex items-center gap-2">
                            <span>🚀</span> Halo 文章发布工具
                        </h1>
                        <p class="text-white/70 mt-2 text-sm">使用 DeepSeek API 智能生成文章并一键发布</p>
                    </div>
                    <a href="/logout" class="px-4 py-2 bg-black/20 hover:bg-black/30 text-white rounded-lg transition-colors text-sm">
                        登出
                    </a>
                </div>
            </div>

            <div class="p-6">
                <form id="articleForm" class="space-y-5">
                    <!-- Prompt Input -->
                    <div>
                        <label class="block text-cyan-400 text-sm font-mono font-semibold mb-2 tracking-wider">PROMPT</label>
                        <textarea id="prompt" rows="4" 
                            class="input-field w-full px-4 py-3 rounded-lg font-mono text-sm resize-none"
                            placeholder="请为今天的 GitHub Trending 写一篇技术博客..."></textarea>
                    </div>

                    <!-- Options Grid -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <div class="flex items-center gap-2 p-3 rounded-lg bg-[#111] border border-[#333]">
                            <input type="checkbox" id="use_template" checked class="w-4 h-4 accent-cyan-400 cursor-pointer">
                            <label for="use_template" class="text-[#aaa] text-sm cursor-pointer">使用模板</label>
                        </div>
                        <div class="p-3 rounded-lg bg-[#111] border border-[#333]">
                            <label for="template_id" class="text-[#666] text-xs block mb-1">风格</label>
                            <select id="template_id" class="w-full bg-transparent text-[#aaa] text-sm border-none outline-none">
                                {{range .template_options}}
                                <option value="{{.id}}">{{.label}}</option>
                                {{end}}
                            </select>
                        </div>
                        <div class="p-3 rounded-lg bg-[#111] border border-[#333]">
                            <label for="language" class="text-[#666] text-xs block mb-1">语言</label>
                            <select id="language" class="w-full bg-transparent text-[#aaa] text-sm border-none outline-none">
                                <option value="zh">🇨🇳 中文</option>
                                <option value="en">🇺🇸 English</option>
                            </select>
                        </div>
                        <div class="p-3 rounded-lg bg-[#111] border border-[#333]">
                            <label for="content_type" class="text-[#666] text-xs block mb-1">类型</label>
                            <select id="content_type" class="w-full bg-transparent text-[#aaa] text-sm border-none outline-none">
                                <option value="post">📝 文章</option>
                                <option value="page">📄 文档</option>
                            </select>
                        </div>
                    </div>

                    <!-- Tags & Categories (only for posts) -->
                    <div id="tags-section" class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-purple-400 text-sm font-mono font-semibold mb-2 tracking-wider">TAGS</label>
                            <div class="flex flex-wrap gap-2 p-3 rounded-lg bg-[#111] border border-[#333] min-h-[48px] focus-within:border-purple-500" id="tagsContainer">
                                <input type="text" id="tagInput" 
                                    class="flex-1 min-w-[80px] bg-transparent text-[#aaa] text-sm border-none outline-none"
                                    placeholder="+ 添加标签">
                            </div>
                        </div>
                        <div>
                            <label class="block text-pink-400 text-sm font-mono font-semibold mb-2 tracking-wider">CATEGORIES</label>
                            <div class="flex flex-wrap gap-2 p-3 rounded-lg bg-[#111] border border-[#333] min-h-[48px] focus-within:border-pink-500" id="categoriesContainer">
                                <input type="text" id="categoryInput" 
                                    class="flex-1 min-w-[80px] bg-transparent text-[#aaa] text-sm border-none outline-none"
                                    placeholder="+ 添加分类">
                            </div>
                        </div>
                    </div>

                    <!-- Slug (only for pages) -->
                    <div id="slug-section" class="hidden">
                        <label class="block text-cyan-400 text-sm font-mono font-semibold mb-2 tracking-wider">SLUG</label>
                        <input type="text" id="page_slug" 
                            class="input-field w-full px-4 py-3 rounded-lg font-mono text-sm"
                            placeholder="可选，默认自动生成">
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex flex-col sm:flex-row gap-3 pt-2">
                        <button type="button" id="generateOnlyBtn" 
                            class="flex-1 px-6 py-3 bg-[#222] hover:bg-[#333] text-[#aaa] font-medium rounded-lg transition-all border border-[#444]">
                            👁️ 仅预览
                        </button>
                        <button type="button" id="generateBtn" 
                            class="flex-1 px-6 py-3 bg-[#222] hover:bg-[#333] text-[#aaa] font-medium rounded-lg transition-all border border-[#444]">
                            💾 保存草稿
                        </button>
                        <button type="button" id="generateAndPublishBtn" 
                            class="flex-1 px-6 py-3 btn-gradient text-white font-semibold rounded-lg transition-all">
                            🚀 生成并发布
                        </button>
                    </div>
                </form>

                <!-- Result Message -->
                <div id="result" class="hidden mt-5 p-4 rounded-lg fade-in"></div>

                <!-- Preview Section -->
                <div id="preview" class="hidden mt-6 p-5 rounded-lg bg-[#111] border border-[#333] fade-in">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold text-white flex items-center gap-2">
                            <span class="text-cyan-400">📄</span> 文章预览
                        </h3>
                        <button type="button" id="publishPreviewBtn" 
                            class="px-4 py-2 btn-gradient text-white rounded-lg text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed">
                            发布
                        </button>
                    </div>
                    <div class="bg-[#0a0a0a] p-5 rounded-lg border border-[#222] max-h-[500px] overflow-y-auto">
                        <div id="previewTitle" class="text-xl font-bold text-pink-400 mb-4"></div>
                        <div id="previewContent" class="preview-content text-[#aaa] text-sm"></div>
                    </div>
                </div>

                <!-- History Section -->
                <div class="mt-6">
                    <h3 class="text-sm font-mono font-semibold text-[#666] tracking-wider mb-3">HISTORY</h3>
                    <div id="historyList" class="rounded-lg bg-[#111] border border-[#333] max-h-[250px] overflow-y-auto">
                        <div class="p-4 text-center text-[#555] text-sm">加载中...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tags = [];
        const categories = [];
        let currentPreview = { title: null, content: null };

        function getPayload() {
            const contentType = document.getElementById('content_type').value;
            const payload = {
                prompt: document.getElementById('prompt').value.trim(),
                use_template: document.getElementById('use_template').checked,
                template_id: document.getElementById('template_id').value,
                language: document.getElementById('language').value,
                content_type: contentType
            };
            if (contentType === 'post') {
                payload.auto_extract_tags = document.getElementById('auto_extract_tags')?.checked || false;
                payload.tags = tags;
                payload.categories = categories;
            } else {
                payload.slug = document.getElementById('page_slug').value.trim();
            }
            return payload;
        }

        function isPageMode() {
            return document.getElementById('content_type').value === 'page';
        }

        function toggleContentType() {
            const isPage = isPageMode();
            document.getElementById('tags-section').classList.toggle('hidden', isPage);
            document.getElementById('slug-section').classList.toggle('hidden', !isPage);
        }

        document.getElementById('content_type').addEventListener('change', toggleContentType);

        function showResult(message, isSuccess = true) {
            const el = document.getElementById('result');
            el.className = `mt-5 p-4 rounded-lg fade-in ${isSuccess ? 'bg-emerald-900/30 text-emerald-400 border border-emerald-800' : 'bg-red-900/30 text-red-400 border border-red-800'}`;
            el.textContent = message;
            el.classList.remove('hidden');
            if (isSuccess) setTimeout(() => el.classList.add('hidden'), 3000);
        }

        function showPreview(title, content) {
            currentPreview = { title, content };
            document.getElementById('previewTitle').textContent = title;
            document.getElementById('previewContent').innerHTML = content;
            document.getElementById('preview').classList.remove('hidden');
            document.getElementById('publishPreviewBtn').disabled = false;
        }

        function escapeHtml(s) {
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }

        async function loadHistory() {
            const el = document.getElementById('historyList');
            try {
                const res = await fetch('/api/history?limit=20');
                const data = await res.json();
                if (!data.success || !data.data?.length) {
                    el.innerHTML = '<div class="p-4 text-center text-[#555] text-sm">暂无历史记录</div>';
                    return;
                }
                el.innerHTML = data.data.map(item => {
                    const time = item.created_at ? new Date(item.created_at).toLocaleString('zh-CN') : '';
                    return `<div class="history-item flex justify-between items-center p-4 cursor-pointer" data-id="${item.id}">
                        <span class="text-[#ddd] text-sm font-medium">${escapeHtml(item.title || '无标题')}</span>
                        <span class="text-[#555] text-xs">${time}</span>
                    </div>`;
                }).join('');
            } catch (e) {
                el.innerHTML = '<div class="p-4 text-center text-red-500 text-sm">加载失败</div>';
            }
        }

        async function apiCall(url, payload, btn, btnText) {
            btn.disabled = true;
            btn.innerHTML = '<svg class="loading inline-block w-4 h-4 mr-2" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>生成中...';
            try {
                const res = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                return await res.json();
            } finally {
                btn.disabled = false;
                btn.innerHTML = btnText;
            }
        }

        document.getElementById('generateOnlyBtn').addEventListener('click', async (e) => {
            const payload = getPayload();
            if (!payload.prompt) { showResult('请输入 prompt', false); return; }
            const data = await apiCall('/api/generate-only', payload, e.target, '👁️ 仅预览');
            if (data.success && data.title && data.content) { showResult(data.message || '已生成', true); showPreview(data.title, data.content); loadHistory(); }
            else showResult(data.error || '生成失败', false);
        });

        document.getElementById('generateBtn').addEventListener('click', async (e) => {
            const payload = getPayload();
            if (!payload.prompt) { showResult('请输入 prompt', false); return; }
            const data = await apiCall('/api/generate', payload, e.target, '💾 保存草稿');
            if (data.success) { showResult(data.message || '已保存为草稿', true); if (data.title && data.content) showPreview(data.title, data.content); loadHistory(); }
            else showResult(data.error || '生成失败', false);
        });

        document.getElementById('generateAndPublishBtn').addEventListener('click', async (e) => {
            const payload = getPayload();
            if (!payload.prompt) { showResult('请输入 prompt', false); return; }
            const isPage = isPageMode();
            const url = isPage ? '/api/generate-and-publish-page' : '/api/generate-and-publish';
            const btnText = isPage ? '🚀 生成并发布文档' : '🚀 生成并发布';
            const data = await apiCall(url, payload, e.target, btnText);
            if (data.title && data.content) showPreview(data.title, data.content);
            if (data.success) { showResult(isPage ? '文档发布成功' : '文章发布成功', true); loadHistory(); }
            else showResult(data.error || '发布失败', false);
        });

        document.getElementById('publishPreviewBtn').addEventListener('click', async (e) => {
            if (!currentPreview.title) { showResult('请先生成文章', false); return; }
            e.target.disabled = true;
            const isPage = isPageMode();
            const url = isPage ? '/api/publish-page' : '/api/publish';
            const payload = isPage 
                ? { title: currentPreview.title, content: currentPreview.content, slug: document.getElementById('page_slug').value.trim() }
                : { title: currentPreview.title, content: currentPreview.content, tags, categories };
            try {
                const res = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                const data = await res.json();
                if (data.success) { showResult(isPage ? '文档发布成功' : '文章发布成功', true); loadHistory(); }
                else showResult('发布失败: ' + data.error, false);
            } finally { e.target.disabled = false; }
        });

        document.getElementById('historyList').addEventListener('click', async (e) => {
            const item = e.target.closest('[data-id]');
            if (!item) return;
            try {
                const res = await fetch('/api/history/' + item.dataset.id);
                const data = await res.json();
                if (data.success) { showPreview(data.title, data.content || ''); showResult('已加载到预览', true); }
            } catch (e) { showResult('加载失败', false); }
        });

        function setupTagInput(inputId, containerId, arr, updateFn) {
            document.getElementById(inputId).addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const val = e.target.value.trim();
                    if (val && !arr.includes(val)) { arr.push(val); updateFn(); e.target.value = ''; }
                }
            });
            document.getElementById(containerId).addEventListener('click', (e) => {
                if (e.target.classList.contains('tag-remove')) {
                    const val = e.target.dataset.tag || e.target.dataset.cat;
                    const idx = arr.indexOf(val);
                    if (idx > -1) { arr.splice(idx, 1); updateFn(); }
                }
            });
        }

        function updateTagsDisplay() {
            const container = document.getElementById('tagsContainer');
            container.querySelectorAll('.tag').forEach(t => t.remove());
            tags.forEach(tag => {
                const el = document.createElement('span');
                el.className = 'tag px-3 py-1 rounded-full text-xs text-white flex items-center gap-1';
                el.innerHTML = `${tag} <span class="tag-remove cursor-pointer hover:text-red-300" data-tag="${tag}">×</span>`;
                container.insertBefore(el, document.getElementById('tagInput'));
            });
        }

        function updateCategoriesDisplay() {
            const container = document.getElementById('categoriesContainer');
            container.querySelectorAll('.tag').forEach(t => t.remove());
            categories.forEach(cat => {
                const el = document.createElement('span');
                el.className = 'tag px-3 py-1 rounded-full text-xs text-white flex items-center gap-1';
                el.innerHTML = `${cat} <span class="tag-remove cursor-pointer hover:text-red-300" data-cat="${cat}">×</span>`;
                container.insertBefore(el, document.getElementById('categoryInput'));
            });
        }

        setupTagInput('tagInput', 'tagsContainer', tags, updateTagsDisplay);
        setupTagInput('categoryInput', 'categoriesContainer', categories, updateCategoriesDisplay);

        loadHistory();
    </script>
</body>
</html>
